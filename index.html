document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    try { if(e&&e.target&&e.target!==window&&e.target.tagName) return; } catch(_){}

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

olumn;overflow:hidden;max-height:580px;}\n@media(max-width:899px){\n  .map-grid{grid-template-columns:1fr;}\n  .map-area{height:clamp(260px,60vw,460px);min-height:unset;}\n  .map-sidebar{border-left:none;border-top:1px solid #E0D5C2;max-height:400px;}\n}\n@media(max-width:600px){\n  .roi-block{padding:28px 22px!important;}\n  .cta-consult{flex-direction:column!important;align-items:stretch!important;}\n  .cta-consult button{width:100%!important;box-sizing:border-box!important;}\n  .risk-grid{grid-template-columns:1fr!important;}\n  .secondary-btns{flex-direction:column!important;}\n  .secondary-btns button{width:100%!important;box-sizing:border-box!important;}\n}\n@media(max-width:600px){\n  .roi-block{padding:28px 22px!important;}\n  .roi-number{font-size:clamp(46px,16vw,72px)!important;}\n  .cta-consult{flex-direction:column!important;align-items:flex-start!important;}\n  .cta-consult button{width:100%!important;}\n  .risk-grid{grid-template-columns:1fr!important;}\n  .secondary-btns{flex-direction:column!important;}\n  .secondary-btns button{width:100%!important;}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:100%;overflow-x:hidden;\">\n\n  <!-- ================= SCENE 1 — PAIN ================= -->\n  <section data-screen-label=\"Интро · Боль\" style=\"min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:120px 7vw 80px;position:relative;\">\n    <div style=\"font:600 13px/1 'Golos Text';letter-spacing:.22em;text-transform:uppercase;color:#B07C4F;margin-bottom:30px;animation:navFade 1s ease both;\">НАВИГАТОР ГОСПОДДЕРЖКИ<\u002Fdiv>\n    <h1 style=\"font-family:'Onest';font-weight:800;font-size:clamp(30px,5.2vw,72px);line-height:1.07;letter-spacing:-.025em;color:#3D2B1F;max-width:22ch;margin:0;animation:navRise .9s cubic-bezier(.16,.8,.3,1) both;\">Узнайте за 30 секунд, какая господдержка доступна именно в вашем регионе<\u002Fh1>\n    <p style=\"font-size:clamp(15px,1.45vw,19px);line-height:1.62;color:#7A6556;max-width:56ch;margin:24px 0 0;animation:navRise 1s cubic-bezier(.16,.8,.3,1) .15s both;\">Социальное предпринимательство, гранты, субсидии, льготные кредиты и региональные программы — только то, что <strong style=\"color:#3D2B1F;\">ЕСТЬ<\u002Fstrong> именно в вашем регионе<\u002Fp>\n    <div style=\"position:absolute;left:7vw;bottom:42px;display:flex;align-items:center;gap:12px;color:#A8987F;font-size:14px;animation:navFade 1.4s ease 1s both;\">\n      <span style=\"display:inline-block;animation:navBob 1.8s ease-in-out infinite;font-size:20px;\">↓<\u002Fspan> прокрутите вниз\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= SCENE 2 — PROMISE ================= -->\n  <section data-screen-label=\"Интро · Было → стало\" style=\"padding:90px 7vw 100px;\">\n    <div style=\"animation:navRiseSm .8s ease both;animation-timeline:view();animation-range:entry 0% cover 26%;\">\n      <div style=\"font:600 13px/1 'Golos Text';letter-spacing:.2em;text-transform:uppercase;color:#B07C4F;margin-bottom:14px;\">Было → стало<\u002Fdiv>\n      <p style=\"font-family:'Onest';font-weight:700;font-size:clamp(18px,2.2vw,28px);line-height:1.3;color:#3D2B1F;margin:0 0 8px;max-width:44ch;\">Возможно, вы уже сейчас можете получить от <span style=\"color:#C8865A;\">300 000 ₽ до нескольких миллионов рублей<\u002Fspan> поддержки<\u002Fp>\n      <p style=\"color:#7A6556;font-size:15.5px;line-height:1.55;margin:0 0 20px;max-width:44ch;\">Но пока просто не знаете, какие программы доступны в вашем регионе.<\u002Fp>\n      <p style=\"color:#8A7A66;font-size:14px;margin:0 0 12px;\">Перетащите ползунок →<\u002Fp>\n    <\u002Fdiv>\n\n    <div ref=\"{{ sliderRef }}\" style=\"position:relative;user-select:none;touch-action:none;border-radius:26px;overflow:hidden;min-height:430px;border:1px solid #D8CFC0;cursor:ew-resize;box-shadow:0 24px 60px -36px rgba(61,43,31,.4);animation:navRiseSm .9s ease both;animation-timeline:view();animation-range:entry 0% cover 34%;\">\n      <!-- B: after (warm, full) -->\n      <div style=\"position:absolute;top:0;bottom:0;right:0;left:{{ sliderPct }}%;background:#EFE7DA;display:grid;grid-template-rows:auto 1fr 1fr 1fr;padding:34px 40px;\">\n        <div style=\"font:700 13px/1 'Onest';letter-spacing:.16em;text-transform:uppercase;color:#7A8450;margin-bottom:6px;\">После<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #DCD0BC;font-size:clamp(14px,1.45vw,18px);color:#3D2B1F;font-weight:500;\"><span style=\"color:#7A8450;font-size:16px;flex:none;\">✓<\u002Fspan>Вижу все меры поддержки, которые доступны в моём регионе<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #DCD0BC;font-size:clamp(14px,1.45vw,18px);color:#3D2B1F;font-weight:500;\"><span style=\"color:#7A8450;font-size:16px;flex:none;\">✓<\u002Fspan>Понимаю, сколько денег я могу привлечь в свой бизнес<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #DCD0BC;font-size:clamp(14px,1.45vw,18px);color:#3D2B1F;font-weight:500;\"><span style=\"color:#7A8450;font-size:16px;flex:none;\">✓<\u002Fspan>Узнаю, какие расходы уже сейчас можно компенсировать за счёт государства<\u002Fdiv>\n      <\u002Fdiv>\n      <!-- A: before (muted, clipped) -->\n      <div style=\"position:absolute;inset:0;width:{{ sliderPct }}%;overflow:hidden;background:#E4D9C7;\">\n        <div style=\"width:{{ sliderW }}px;height:100%;display:grid;grid-template-rows:auto 1fr 1fr 1fr;padding:34px 40px;\">\n          <div style=\"font:700 13px/1 'Onest';letter-spacing:.16em;text-transform:uppercase;color:#A8987F;margin-bottom:6px;\">Сейчас<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #D3C6B0;font-size:clamp(14px,1.45vw,18px);color:#8C7C68;\"><span style=\"color:#B5654A;font-size:14px;flex:none;\">✕<\u002Fspan>Не понимаю, есть ли господдержка в моём регионе<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #D3C6B0;font-size:clamp(14px,1.45vw,18px);color:#8C7C68;\"><span style=\"color:#B5654A;font-size:14px;flex:none;\">✕<\u002Fspan>Боюсь потратить месяцы впустую, пытаясь разобраться самостоятельно<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;border-top:1px solid #D3C6B0;font-size:clamp(14px,1.45vw,18px);color:#8C7C68;\"><span style=\"color:#B5654A;font-size:14px;flex:none;\">✕<\u002Fspan>Не знаю, могу ли получить реальные деньги<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- handle -->\n      <div style=\"position:absolute;top:0;bottom:0;left:{{ sliderPct }}%;width:2px;background:{{ accent }};transform:translateX(-1px);pointer-events:none;\">\n        <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:{{ accent }};color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 6px 18px -4px rgba(61,43,31,.5);\">⇆<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= SCENE 3 — HOW IT WORKS ================= -->\n  <section data-screen-label=\"Интро · Как это работает\" style=\"padding:50px 7vw 110px;\">\n    <div style=\"animation:navRiseSm .8s ease both;animation-timeline:view();animation-range:entry 0% cover 24%;\">\n      <div style=\"font:600 13px/1 'Golos Text';letter-spacing:.2em;text-transform:uppercase;color:#B07C4F;margin-bottom:14px;\">Как это работает<\u002Fdiv>\n      <h2 style=\"font-family:'Onest';font-weight:700;font-size:clamp(26px,3.4vw,44px);line-height:1.1;letter-spacing:-.02em;color:#3D2B1F;margin:0 0 44px;\">Три шага — и картина ясна<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;\">\n      <div style=\"background:#EFE7DA;border:1px solid #E0D5C2;border-radius:22px;padding:34px 30px 38px;animation:navRiseSm .7s ease both;animation-timeline:view();animation-range:entry 0% cover 38%;\">\n        <div style=\"font-family:'Onest';font-weight:800;font-size:46px;color:#C8865A;line-height:1;margin-bottom:22px;\">01<\u002Fdiv>\n        <h3 style=\"font-family:'Onest';font-weight:700;font-size:21px;color:#3D2B1F;margin:0 0 10px;\">Выберите регион и статус<\u002Fh3>\n        <p style=\"font-size:15.5px;line-height:1.5;color:#6B5640;margin:0;\">За 30 секунд на карте — вместо года хождений по инстанциям.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#EFE7DA;border:1px solid #E0D5C2;border-radius:22px;padding:34px 30px 38px;animation:navRiseSm .7s ease .08s both;animation-timeline:view();animation-range:entry 0% cover 38%;\">\n        <div style=\"font-family:'Onest';font-weight:800;font-size:46px;color:#7A8450;line-height:1;margin-bottom:22px;\">02<\u002Fdiv>\n        <h3 style=\"font-family:'Onest';font-weight:700;font-size:21px;color:#3D2B1F;margin:0 0 10px;\">Увидьте свои суммы<\u002Fh3>\n        <p style=\"font-size:15.5px;line-height:1.5;color:#6B5640;margin:0;\">Сколько вам положено получить и сколько законно можно не платить.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#EFE7DA;border:1px solid #E0D5C2;border-radius:22px;padding:34px 30px 38px;animation:navRiseSm .7s ease .16s both;animation-timeline:view();animation-range:entry 0% cover 38%;\">\n        <div style=\"font-family:'Onest';font-weight:800;font-size:46px;color:#C8A05A;line-height:1;margin-bottom:22px;\">03<\u002Fdiv>\n        <h3 style=\"font-family:'Onest';font-weight:700;font-size:21px;color:#3D2B1F;margin:0 0 10px;\">Заберите PDF-план<\u002Fh3>\n        <p style=\"font-size:15.5px;line-height:1.5;color:#6B5640;margin:0;\">«Иди и оформляй» на руках — со следующим шагом и без риска отказа.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:center;margin-top:54px;\">\n      <button onclick=\"{{ scrollToFunnel }}\" style=\"background:{{ accent }};color:#fff;font-family:'Onest';font-weight:700;font-size:18px;padding:19px 40px;border-radius:16px;box-shadow:0 14px 34px -14px rgba(200,134,90,.85);transition:transform .2s ease,box-shadow .2s ease;\" style-hover=\"transform:translateY(-2px);box-shadow:0 18px 40px -12px rgba(200,134,90,.95);\">Найти свой регион →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= FUNNEL ================= -->\n  <section id=\"funnel\" data-screen-label=\"Funnel\" style=\"background:#EFE7DA;border-top:1px solid #E0D5C2;padding:64px 7vw 90px;\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:34px;\">\n      <h2 style=\"font-family:'Onest';font-weight:700;font-size:clamp(22px,2.7vw,34px);line-height:1.14;letter-spacing:-.02em;color:#3D2B1F;margin:0;max-width:24ch;\">Узнайте, сколько вам положено от государства — по вашему региону и статусу<\u002Fh2>\n      <div style=\"display:inline-flex;align-items:center;gap:9px;background:#F5EFE6;border:1px solid #DCD0BC;border-radius:999px;padding:9px 16px;font-size:13.5px;color:#6B5640;white-space:nowrap;\">\n        <span style=\"width:8px;height:8px;border-radius:50%;background:#7A8450;\"><\u002Fspan>Данные актуальны на {{ date }}\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ---------- DEMO (before pay) ---------- -->\n    <sc-if value=\"{{ notPaid }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <!-- status tabs -->\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px;\">\n        <sc-for list=\"{{ statuses }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <button onclick=\"{{ s.onClick }}\" style=\"flex:1;min-width:140px;padding:15px 18px;border-radius:14px;border:1.5px solid {{ s.bc }};background:{{ s.bg }};color:{{ s.fg }};font-family:'Onest';font-weight:700;font-size:16px;transition:all .18s ease;\">{{ s.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- SVG карта России -->\n      <div style=\"border-radius:22px;overflow:hidden;border:1px solid #DCD0BC;\">\n        <!-- ФО chips -->\n        <div style=\"padding:10px 16px;background:#F5EFE6;border-bottom:1px solid #E0D5C2;display:flex;flex-wrap:wrap;gap:5px;align-items:center;\">\n          <span style=\"font-size:11px;font-weight:600;color:#A8987F;margin-right:4px;flex:none;\">Округ:<\u002Fspan>\n          <sc-for list=\"{{ fdLegend }}\" as=\"g\" hint-placeholder-count=\"8\">\n            <button onclick=\"{{ g.onClick }}\" style=\"display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:11px;font-family:inherit;font-weight:600;cursor:pointer;transition:all .14s;background:{{ g.chipBg }};border:1px solid {{ g.chipBorder }};color:{{ g.chipColor }};\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ g.dotColor }};display:inline-block;flex:none;\"><\u002Fspan>{{ g.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <!-- map + sidebar -->\n        <div class=\"map-grid\">\n          <!-- SVG -->\n          <div class=\"map-area\" style=\"background:radial-gradient(120% 120% at 60% 10%, #eeeae2 0%, #e4dfd6 60%, #dbd5ca 100%);\">\n            <svg viewBox=\"0 0 1000 620\" preserveAspectRatio=\"xMidYMid meet\" style=\"position:absolute;inset:0;width:100%;height:100%;\">\n              <g>\n                <sc-for list=\"{{ mapPaths }}\" as=\"r\" hint-placeholder-count=\"0\">\n                  <path d=\"{{ r.d }}\" fill=\"{{ r.fill }}\" stroke=\"{{ r.stroke }}\" stroke-width=\"{{ r.sw }}\" stroke-linejoin=\"round\" style=\"cursor:pointer;transition:fill .14s ease;filter:{{ r.shadowFilter }};\" onclick=\"{{ r.onClick }}\" onmouseenter=\"{{ r.onEnter }}\" onmouseleave=\"{{ r.onLeave }}\"><\u002Fpath>\n                <\u002Fsc-for>\n              <\u002Fg>\n              <g style=\"pointer-events:none;\">{{ mapLabels }}<\u002Fg>\n            <\u002Fsvg>\n            <sc-if value=\"{{ mapNotReady }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#8A7A66;font-weight:600;\">Загрузка географии…<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <!-- sidebar -->\n          <div class=\"map-sidebar\">\n            <div style=\"padding:14px 16px 10px;border-bottom:1px solid #EFE7DA;flex:none;\">\n              <sc-if value=\"{{ mapHasSel }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:6px;\"><span style=\"width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:{{ mapSel.fdColor }};\"><\u002Fspan><span style=\"font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:{{ mapSel.fdColor }};\">{{ mapSel.fdName }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-family:'Onest';font-weight:800;font-size:17px;line-height:1.15;letter-spacing:-.01em;color:#3D2B1F;margin-bottom:2px;\">{{ mapSel.name }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#8A7A66;margin-bottom:11px;\">{{ mapSel.type }}<\u002Fdiv>\n                  <div style=\"display:flex;gap:6px;margin-bottom:11px;\">\n                    <div style=\"flex:1;background:#EFE7DA;border:1px solid #E0D5C2;border-radius:10px;padding:8px 10px;\"><div style=\"font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#A8987F;margin-bottom:2px;\">Столица<\u002Fdiv><div style=\"font-size:12.5px;font-weight:700;color:#3D2B1F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ mapSel.capital }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"width:72px;background:#EFE7DA;border:1px solid #E0D5C2;border-radius:10px;padding:8px 10px;\"><div style=\"font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#A8987F;margin-bottom:2px;\">Код<\u002Fdiv><div style=\"font-size:12.5px;font-weight:700;color:#3 "it\" hint-placeholder-count=\"0\">\n                    <button onclick=\"{{ it.onClick }}\" onmouseenter=\"{{ it.onEnter }}\" onmouseleave=\"{{ it.onLeave }}\" style=\"display:flex;align-items:center;gap:7px;width:100%;border:none;border-radius:7px;padding:5px 7px;cursor:pointer;font-family:inherit;transition:background .1s;background:{{ it.bg }};color:{{ it.fg }};font-weight:{{ it.fw }};\"><span style=\"width:2.5px;height:14px;border-radius:3px;flex:none;background:{{ it.barBg }};\"><\u002Fspan><span style=\"flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;\">{{ it.name }}<\u002Fspan><span style=\"font-size:9.5px;font-weight:600;color:#B0A090;flex:none;\">{{ it.shortId }}<\u002Fspan><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ mapEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:16px 8px;text-align:center;font-size:12.5px;color:#A8987F;font-weight:500;\">Ничего не найдено<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- counter / hint -->\n      <sc-if value=\"{{ showCounter }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:24px;background:#F5EFE6;border:1px solid #DCD0BC;border-radius:24px;padding:42px 40px;text-align:center;animation:navPop .5s cubic-bezier(.16,.8,.3,1) both;\">\n        <div style=\"font-size:16px;color:#6B5640;margin-bottom:6px;\">В регионе «{{ regionName }}» для статуса «{{ statusLabel }}» доступно<\u002Fdiv>\n        <div style=\"font-family:'Onest';font-weight:800;font-size:clamp(72px,12vw,128px);line-height:1;color:#3D2B1F;letter-spacing:-.03em;\">{{ countVal }}<\u002Fdiv>\n        <div style=\"font-size:19px;color:#3D2B1F;font-weight:600;margin-top:2px;\">мер поддержки и льгот<\u002Fdiv>\n        <div style=\"display:inline-flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;justify-content:center;font-size:14px;color:#6B5640;\">\n          <span style=\"display:inline-flex;align-items:center;gap:7px;\"><span style=\"width:11px;height:11px;border-radius:3px;background:#7A8450;\"><\u002Fspan>{{ getCount }} — на деньги<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:7px;\"><span style=\"width:11px;height:11px;border-radius:3px;background:#C8A05A;\"><\u002Fspan>{{ saveCount }} — налоговые льготы<\u002Fspan>\n        <\u002Fdiv>\n        <!-- blurred rows -->\n        <div style=\"max-width:520px;margin:26px auto 0;display:flex;flex-direction:column;gap:11px;\">\n          <sc-for list=\"{{ blurRows }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:14px;background:#EFE7DA;border:1px solid #E2D7C4;border-radius:12px;padding:14px 16px;\">\n              <div style=\"width:9px;height:9px;border-radius:3px;background:{{ b.dot }};flex:none;\"><\u002Fdiv>\n              <div style=\"height:11px;border-radius:6px;background:#D8CFC0;filter:blur(2.5px);width:{{ b.w }};\"><\u002Fdiv>\n              <div style=\"margin-left:auto;height:14px;width:78px;border-radius:6px;background:#CFC4B0;filter:blur(3px);\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button onclick=\"{{ onPayOpen }}\" style=\"margin-top:30px;background:{{ accent }};color:#fff;font-family:'Onest';font-weight:700;font-size:18px;padding:18px 38px;border-radius:15px;box-shadow:0 14px 32px -14px rgba(200,134,90,.85);transition:transform .2s ease;\" style-hover=\"transform:translateY(-2px);\">Открыть полный список — 900 ₽<\u002Fbutton>\n        <div style=\"font-size:13.5px;color:#8A7A66;margin-top:14px;\">900 ₽ зачитываются в консультацию. Разведка обходится в 0 ₽.<\u002Fdiv><div style=\"font-size:12.5px;color:#A8987F;margin-top:8px;line-height:1.5;max-width:46ch;\">Вы будете переадресованы на платёжный сервис Prodamus. После оплаты меры поддержки откроются и станут вам доступны.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showHint }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:24px;border:1.5px dashed #D2C6B2;border-radius:20px;padding:34px;text-align:center;color:#8A7A66;font-size:16px;\">\n        Выберите <b style=\"color:#6B5640;\">регион<\u002Fb> и <b style=\"color:#6B5640;\">статус<\u002Fb> — и увидите, сколько именно вам доступно.\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ---------- RESULT (after pay) ---------- -->\n    <sc-if value=\"{{ isPaid }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Экран 2 · Выдача\" style=\"animation:navFade .5s ease both;\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:26px;\">\n        <div style=\"display:inline-flex;align-items:center;gap:8px;background:#7A8450;color:#fff;border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:600;\">✓ Доступ открыт<\u002Fdiv>\n        <div style=\"font-size:15px;color:#6B5640;\">{{ regionName }} · {{ statusLabel }}<\u002Fdiv>\n        <button onclick=\"{{ onChooseAnother }}\" style=\"margin-left:auto;color:#B07C4F;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;\">← Выбрать другой регион<\u002Fbutton>\n      <\u002Fdiv>\n\n      <!-- «Сидел на золоте» WOW-блок -->\n      <sc-if value=\"{{ showGold }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-bottom:26px;background:linear-gradient(135deg,#FBF3E3 0%,#F7EDCF 100%);border:1.5px solid #D8B86A;border-radius:20px;padding:22px 26px;display:flex;gap:18px;align-items:flex-start;animation:navRiseSm .6s ease .1s both;\">\n        <div style=\"font-size:28px;flex:none;line-height:1.1;margin-top:1px;\">💡<\u002Fdiv>\n        <div style=\"flex:1;min-width:0;\">\n          <div style=\"font:700 11px/1 'Onest';letter-spacing:.1em;text-transform:uppercase;color:#9A7020;margin-bottom:9px;\">Вы сидели на золоте<\u002Fdiv>\n          <div style=\"font-family:'Onest';font-weight:700;font-size:clamp(15px,1.4vw,18px);line-height:1.38;color:#3D2B1F;margin-bottom:7px;\">{{ goldTitle }}<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#6B5640;line-height:1.58;\">{{ goldDesc }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Layer 1: measure cards -->\n      <div style=\"font:700 13px/1 'Onest';letter-spacing:.14em;text-transform:uppercase;color:#A8987F;margin:0 0 16px;\">Что вам доступно<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;\">\n        <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"background:#F5EFE6;border:1px solid #E2D7C4;border-top:4px solid {{ c.color }};border-radius:18px;padding:22px 22px 20px;display:flex;flex-direction:column;animation:navRiseSm .5s ease both;\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap;\">\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n                <span style=\"background:{{ c.tint }};color:{{ c.color }};font-weight:700;font-size:11px;border-radius:999px;padding:4px 11px;\">{{ c.catLabel }}<\u002Fspan>\n                <span style=\"background:#EFE7DA;color:#6B5640;font-weight:600;font-size:11px;border-radius:999px;padding:4px 11px;border:1px solid #DCD0BC;\">{{ c.level }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:11px;color:#A8987F;white-space:nowrap;background:{{ c.tint }};padding:3px 9px;border-radius:999px;\">{{ c.kindLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-family:'Onest';font-weight:700;font-size:17.5px;line-height:1.25;color:#3D2B1F;margin:0 0 12px;\">{{ c.title }}<\u002Fh3>\n            <div style=\"font-family:'Onest';font-weight:800;font-size:34px;line-height:1;color:{{ c.color }};letter-spacing:-.02em;\">{{ c.amountText }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#8A7A66;margin-top:6px;min-height:18px;\">{{ c.note }}<\u002Fdiv>\n            <div style=\"margin-top:14px;font-size:13.5px;color:#6B5640;display:flex;align-items:center;gap:8px;\"><span style=\"color:#B07C4F;\">●<\u002Fspan>{{ c.deadline }}<\u002Fdiv>\n            <div style=\"margin-top:12px;border-top:1px dashed #DCD0BC;padding-top:12px;\">\n              <div style=\"font-size:12px;color:#A8987F;margin-bottom:7px;\">Документы:<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px;\">\n                <sc-for list=\"{{ c.docs }}\" as=\"d\" hint-placeholder-count=\"3\">\n                  <div style=\"font-size:13.5px;color:#4A3526;display:flex;gap:8px;\"><span style=\"color:#C8865A;\">›<\u002Fspan>{{ d }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;font-size:12.5px;color:#8A7A66;\">Основание: <span style=\"color:#6B5640;text-decoration:underline;text-underline-offset:2px;\">{{ c.law }}<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:11.5px;color:#A8987F;border-top:1px dashed #E2D7C4;padding-top:8px;\"><span><span style=\"color:#7A8450;font-weight:600;\">Официальные источники<\u002Fspan><\u002Fspan><span>Актуально на {{ c.updated }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- Layer 2: ROI -->\n      <div class=\"roi-block\" style=\"margin-top:26px;background:#3D2B1F;border-radius:24px;padding:42px 44px;color:#F1E7D8;position:relative;overflow:hidden;\">\n        <div style=\"font:700 13px/1 'Onest';letter-spacing:.14em;text-transform:uppercase;color:#C8A05A;margin-bottom:24px;\">Ваша выгода<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline;font-size:16px;color:#CDBBA4;margin-bottom:18px;\">\n          <span><span style=\"color:#A9D08E;font-weight:600;\">{{ supportText }}<\u002Fspan> поддержки<\u002Fspan>\n          <span style=\"color:#7A6A56;\">+<\u002Fspan>\n          <span><span style=\"color:#E6C77E;font-weight:600;\">{{ taxText }}<\u002Fspan> экономии на налогах<\u002Fspan>\n          \n        <\u002Fdiv>\n        <div style=\"font-family:'Onest';font-weight:800;font-size:clamp(54px,9vw,104px);line-height:1;color:#fff;letter-spacing:-.03em;\">{{ benefitText }}<\u002Fdiv>\n        <div style=\"font-size:17px;color:#CDBBA4;margin-top:14px;\">чистая выгода — окупает 900 ₽ в <b style=\"color:#E6C77E;\">{{ repay }}×<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- consultation CTA — Важно знать + Эксперт -->\n      <div style=\"margin-top:26px;background:#EFE7DA;border-radius:22px;padding:32px 30px;\">\n        <div style=\"font:600 13px/1 'Golos Text';letter-spacing:.2em;text-transform:uppercase;color:#B07C4F;margin-bottom:14px;\">Важно знать<\u002Fdiv>\n        <h3 style=\"font-family:'Onest';font-weight:700;font-size:clamp(17px,2vw,24px);line-height:1.2;color:#3D2B1F;margin:0 0 16px;max-width:30ch;\">Вы получили список всех доступных мер поддержки. Но есть проблема:<\u002Fh3>\n        <div style=\"background:#FBF4EB;border-left:4px solid #B5654A;border-radius:0 14px 14px 0;padding:15px 18px;margin-bottom:22px;\">\n          <p style=\"font-family:'Onest';font-weight:700;font-size:clamp(13.5px,1.4vw,16px);line-height:1.5;color:#8E4733;margin:0;\">В 80% случаев предприниматели выбирают не ту меру поддержки и теряют время, деньги и возможность получить максимальную сумму.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"font-weight:600;font-size:15px;color:#3D2B1F;margin-bottom:12px;\">На консультации мы определим:<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;margin-bottom:26px;\">\n          <div style=\"display:flex;gap:9px;background:#F5EFE6;border:1px solid #DCD0BC;border-radius:11px;padding:11px 13px;\"><span style=\"color:#7A8450;flex:none;\">✓<\u002Fspan><span style=\"font-size:13px;color:#4A3526;\">на какие меры вы подходите именно сейчас<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;background:#F5EFE6;border:1px solid #DCD0BC;border-radius:11px;padding:11px 13px;\"><span style=\"color:#7A8450;flex:none;\">✓<\u002Fspan><span style=\"font-size:13px;color:#4A3526;\">какие суммы реально можете получить именно вы<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;background:#F5EFE6;border:1px solid #DCD0BC;border-radius:11px;padding:11px 13px;\"><span style=\"color:#7A8450;flex:none;\">✓<\u002Fspan><span style=\"font-size:13px;color:#4A3526;\">какие расходы бизнеса можно компенсировать<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;background:#F5EFE6;border:1px solid #DCD0BC;border-radius:11px;padding:11px 13px;\"><span style=\"color:#7A8450;flex:none;\">✓<\u002Fspan><span style=\"font-size:13px;color:#4A3526;\">с какой программы выгоднее начать<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;background:#F5EFE6;border:1px solid #DCD0BC;border-radius:11px;padding:11px 13px;\"><span style=\"color:#7A8450;flex:none;\">✓<\u002Fspan><span style=\"font-size:13px;color:#4A3526;\">как совместить несколько мер поддержки<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;background:#F5EFE6;border:1px solid #DCD0BC;border-radius:11px;padding:11px 13px;\"><span style=\"color:#7A8450;flex:none;\">✓<\u002Fspan><span style=\"font-size:13px;color:#4A3526;\">какой пошаговый маршрут будет самым быстрым<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#F5EFE6;border:1px solid #DCD0BC;border-radius:18px;padding:24px 26px;display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-start;\">\n          <div style=\"flex:1;min-width:220px;\">\n            <div style=\"font:600 11px/1 'Golos Text';letter-spacing:.2em;text-transform:uppercase;color:#B07C4F;margin-bottom:11px;\">Эксперт<\u002Fdiv>\n            <div style=\"font-family:'Onest';font-weight:700;font-size:clamp(16px,1.6vw,20px);line-height:1.3;color:#3D2B1F;margin-bottom:10px;\">Навигатор показывает возможности. Я помогаю дойти до денег.<\u002Fdiv>\n            <p style=\"font-size:13.5px;line-height:1.6;color:#6B5640;margin:0 0 18px;\">В 2024 году я получила статус социального предпринимателя и более <strong style=\"color:#3D2B1F;\">2 млн ₽ поддержки<\u002Fstrong>. На консультации определим, какие программы подходят именно вам.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;\">\n              <button onclick=\"{{ onConsult }}\" style=\"background:#C8865A;color:#fff;font-family:'Onest';font-weight:700;font-size:15.5px;padding:14px 26px;border-radius:13px;box-shadow:0 10px 24px -10px rgba(200,134,90,.85);white-space:nowrap;transition:transform .2s ease;\" style-hover=\"transform:translateY(-2px);\">Записаться на разбор<\u002Fbutton>\n              <div style=\"font-size:13px;color:#8A7A66;\">6 000 ₽ <span style=\"text-decoration:line-through;\">−900 ₽<\u002Fspan> = 5 100 ₽<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <img src=\"expert.jpg\" alt=\"Эксперт\" style=\"width:130px;height:170px;flex:none;border-radius:14px;object-fit:cover;object-position:center 20%;background:#EFE7DA;\" />\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- secondary -->\n      <div class=\"secondary-btns\" style=\"margin-top:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;\">\n        <button onclick=\"{{ onPdf }}\" style=\"border:1.5px solid #C9BCA6;color:#6B5640;font-weight:600;font-size:14.5px;padding:12px 20px;border-radius:12px;background:#F5EFE6;\">⬇ Скачать PDF-план<\u002Fbutton>\n        <button onclick=\"{{ onCheck }}\" style=\"border:1.5 onst mapRegs=this._regs||[];\n    const mSel=this.state.mapSel,mHov=this.state.mapHover,fdFilter=this.state.fdFilter;\n    const accentOf=(fd)=>FD[fd]?.color||'#8A7A66';\n    const orderedRegs=mapRegs.slice().sort((a,b)=>{\n      const rank=r=>r.id===mSel?2:(r.id===mHov?1:0);\n      return rank(a)-rank(b);\n    });\n    const mapPaths=orderedRegs.map(r=>{\n      const acc=accentOf(r.fd),isSel=r.id===mSel,isHov=r.id===mHov;\n      const dim=fdFilter&&r.fd!==fdFilter;\n      let fill=dim?'#cdc8bc':'#d8d3c8';\n      if(isSel) fill=acc;\n      else if(isHov) fill=this.mix(acc,'#F5EFE6',0.52);\n      else if(fdFilter&&r.fd===fdFilter) fill=this.mix(acc,'#F5EFE6',0.72);\n      return {id:r.id,d:r.d,fill,\n        stroke:isSel?'#fff':(isHov?this.mix(acc,'#8a7a66',0.2):'#ece6dc'),\n        sw:isSel?1.8:(isHov?1.0:0.5),\n        shadowFilter:isSel?'drop-shadow(0 2px 6px rgba(61,43,31,.28))':'none',\n        onClick:()=>this.clickMapReg(r.id),\n        onEnter:()=>this.setMapHover(r.id),\n        onLeave:()=>this.clearMapHover(r.id)};\n    });\n    const mapLabels=orderedRegs.map(r=>{\n      const isSel=r.id===mSel,isHov=r.id===mHov;\n      const big=r.area>900,mid=r.area>230;\n      let op=big?0.92:(mid?0.68:0.36);\n      if(isSel||isHov) op=1;\n      if(fdFilter&&r.fd!==fdFilter&&!isSel&&!isHov) op*=0.25;\n      const fs=isSel?13.5:(isHov?12:(big?11:(mid?9:7.8)));\n      return React.createElement('text',{\n        key:r.id,x:r.cx,y:r.cy,textAnchor:'middle',dominantBaseline:'central',\n        fontSize:fs,fontWeight:(isSel||isHov||big)?700:600,\n        fill:isSel?'#1b1922':'#3D2B1F',opacity:op,\n        stroke:'#F5EFE6',strokeWidth:isSel?3:2.5,paintOrder:'stroke',\n        style:{strokeLinejoin:'round',fontFamily:'Golos Text, sans-serif'}\n      },r.short);\n    });\n    const fdOrder=['ЦФО','СЗФО','ЮФО','СКФО','ПФО','УФО','СФО','ДФО'];\n    const fdLegend=fdOrder.map(k=>{\n      const fd=FD[k],active=fdFilter===k;\n      return {key:k,name:fd.name,\n        chipBg:active?this.mix(fd.color,'#F5EFE6',0.78):'#F5EFE6',\n        chipBorder:active?fd.color:'#DCD0BC',\n        chipColor:active?fd.color:'#6B5640',\n        dotColor:fd.color,\n        onClick:()=>this.setState(s=>({fdFilter:s.fdFilter===k?null:k}))};\n    });\n    const selGeoReg=mapRegs.find(r=>r.id===mSel)||null;\n    let mapSel=null;\n    if(selGeoReg){\n      const fd=FD[selGeoReg.fd]||{name:'',color:'#8A7A66'};\n      const acc=accentOf(selGeoReg.fd);\n      const hasPage=!!this.GEO_TO_PAGE[selGeoReg.id];\n      const pageCode=this.GEO_TO_PAGE[selGeoReg.id];\n      const isPageSel=!!(pageCode&&this.state.region===pageCode);\n      mapSel={\n        id:selGeoReg.id.replace('RU-',''),\n        name:selGeoReg.name,type:selGeoReg.type,capital:selGeoReg.capital,\n        fdName:fd.name,fdColor:acc,\n        ctaLabel:hasPage?(isPageSel?'✓ Регион выбран':'Выбрать регион'):'Меры появятся скоро',\n        ctaBg:hasPage?(isPageSel?this.mix(acc,'#F5EFE6',0.82):acc):'#E0D5C2',\n        ctaColor:hasPage?(isPageSel?acc:'#fff'):'#A8987F',\n        onSelect:hasPage&&!isPageSel?(()=>this.selectRegion(pageCode)):(()=>{})\n      };\n    }\n    const mq=(this.state.mapQuery||'').trim().toLowerCase();\n    const mapGroups=fdOrder.map(k=>{\n      const fd=FD[k];\n      const items=mapRegs.filter(r=>r.fd===k)\n        .filter(r=>!mq||r.name.toLowerCase().includes(mq)||r.capital.toLowerCase().includes(mq)||r.id.toLowerCase().includes(mq))\n        .sort((a,b)=>a.name.localeCompare(b.name,'ru'))\n        .map(r=>{\n          const isSel=r.id===mSel,isHov=r.id===mHov,acc=accentOf(r.fd);\n          return {id:r.id,name:r.name,shortId:r.id.replace('RU-',''),\n            bg:isSel?this.mix(acc,'#F5EFE6',0.78):(isHov?'#EFE7DA':'transparent'),\n            fg:isSel?'#3D2B1F':'#4A3526',fw:isSel?700:500,\n            barBg:isSel?acc:(isHov?this.mix(fd.color,'#F5EFE6',0.5):'transparent'),\n            onClick:()=>this.clickMapReg(r.id),\n            onEnter:()=>this.setMapHover(r.id),\n            onLeave:()=>this.clearMapHover(r.id)};\n        });\n      return {key:k,name:fd.name,color:fd.color,count:items.length,items};\n    }).filter(g=>g.items.length>0);\n    const mapTotalShown=mapGroups.reduce((n,g)=>n+g.count,0);\n    // === END MAP ===\n\n    return {\n      accent,\n      date: this.props.dateLabel || '28.06.2026',\n      sliderRef:this.sliderRef, sliderPct:this.state.sliderPct, sliderW:Math.max(this.state.sliderW, 900), startDrag:this.startDrag, onSliderMove:this.onSliderMove, onSliderUp:this.onSliderUp,\n      scrollToFunnel:this.scrollToFunnel,\n      tiles, list, statuses,\n      search, onSearch:this.onSearch,\n      bothSelected,\n      notPaid: !this.state.isPaid,\n      isPaid: this.state.isPaid,\n      showPay: this.state.showPay,\n      showCounter: bothSelected && !this.state.isPaid,\n      showHint: !bothSelected,\n      regionName, statusLabel,\n      countVal, getCount, saveCount, blurRows,\n      cards, supportText, taxText, benefitText, repay,\n      risks:this.RISKS,\n      note:this.state.note,\n      showGold: !!(this.state.status && this.state.isPaid),\n      goldTitle: this.state.status ? (this.GOLD[this.state.status]||{}).title||'' : '',\n      goldDesc:  this.state.status ? (this.GOLD[this.state.status]||{}).desc||''  : '',\n      onPayOpen:this.onPayOpen, onPayClose:this.onPayClose, onPayConfirm:this.onPayConfirm, stop:this.stop,\n      onChooseAnother:this.onChooseAnother, onConsult:this.onConsult, onPdf:this.onPdf, onCheck:this.onCheck,\n      mapNotReady:!this.state.mapReady,\n      mapPaths,mapLabels,fdLegend,mapGroups,\n      mapHasSel:!!mapSel,mapNoSel:!mapSel,mapSel,\n      mapQuery:this.state.mapQuery,onMapSearch:this.onMapSearch,\n      mapEmpty:this.state.mapReady&&mapTotalShown===0,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<button id=\"howto-btn\" type=\"button\" onclick=\"var m=document.getElementById('howto-modal');if(m)m.style.display='flex';\" style=\"position:fixed;right:16px;bottom:16px;z-index:99998;background:#7A8450;color:#fff;border:none;border-radius:999px;padding:12px 18px;font-family:'Onest',sans-serif;font-weight:700;font-size:14px;box-shadow:0 10px 26px -8px rgba(61,43,31,.5);cursor:pointer;\">📖 Инструкция<\u002Fbutton><div id=\"howto-modal\" onclick=\"if(event.target===this)this.style.display='none';\" style=\"display:none;position:fixed;inset:0;z-index:99999;background:rgba(45,32,22,.55);align-items:center;justify-content:center;padding:16px;\"><div style=\"background:#FBF8F2;max-width:460px;width:100%;max-height:86vh;overflow:auto;border-radius:20px;padding:26px 24px;font-family:'Golos Text',sans-serif;color:#3D2B1F;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);\"><div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;\"><div style=\"font-family:'Onest',sans-serif;font-weight:800;font-size:19px;\">Как пользоваться сайтом<\u002Fdiv><button type=\"button\" onclick=\"document.getElementById('howto-modal').style.display='none';\" style=\"background:none;border:none;font-size:24px;color:#8A7A66;cursor:pointer;line-height:1;\">&times;<\u002Fbutton><\u002Fdiv><ol style=\"margin:0 0 4px 20px;padding:0;font-size:14.5px;line-height:1.6;\"><li style=\"margin-bottom:9px;\">Найдите свой <b>регион<\u002Fb> на карте или через поиск справа.<\u002Fli><li style=\"margin-bottom:9px;\">Выберите свой <b>статус<\u002Fb>: самозанятый, ИП или ООО.<\u002Fli><li style=\"margin-bottom:9px;\">Сайт покажет, <b>сколько мер поддержки<\u002Fb> доступно именно вам.<\u002Fli><li style=\"margin-bottom:9px;\">Нажмите <b>«Открыть полный список — 900 ₽»<\u002Fb> и оплатите на Prodamus.<\u002Fli><li style=\"margin-bottom:9px;\">После оплаты откроется <b>полный список мер<\u002Fb> — с суммами, сроками и документами.<\u002Fli><li style=\"margin-bottom:9px;\">Список можно <b>сохранить в PDF<\u002Fb>, а для персонального подбора — записаться на разбор.<\u002Fli><\u002Fol><button type=\"button\" onclick=\"document.getElementById('howto-modal').style.display='none';\" style=\"margin-top:16px;width:100%;background:#C8865A;color:#fff;border:none;border-radius:12px;padding:13px;font-family:'Onest',sans-serif;font-weight:700;font-size:15px;cursor:pointer;\">Понятно<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fbody><\u002Fhtml>"
